<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gym Tracker V17 (Full Memory) 🧠</title>
    
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    
    <style>
        :root { --bg: #000; --card: #1c1c1e; --text: #fff; --accent: #00e676; --warmup: #ff9100; --del: #ff5252; }
        body { font-family: sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 15px; text-align: center; padding-bottom: 120px; }
        
        .screen { display: none; }
        .visible { display: block; }
        
        h1 { color: var(--accent); margin-bottom: 20px; }
        
        .menu-btn { 
            display: block; width: 100%; background: var(--card); border: 1px solid #333; 
            color: white; padding: 25px; font-size: 1.5rem; margin-bottom: 15px; border-radius: 15px; cursor: pointer;
        }

        .exercise-card { background: var(--card); padding: 15px; margin-bottom: 20px; border-radius: 16px; border-right: 6px solid var(--accent); text-align: right; }
        .ex-title { font-size: 1.4rem; font-weight: bold; margin-bottom: 15px; display: block; }
        
        .set-row { 
            display: flex; gap: 10px; margin-bottom: 10px; align-items: center; 
            background: #2c2c2e; padding: 10px; border-radius: 10px; 
        }
        
        .set-row.is-warmup { 
            background: rgba(255, 145, 0, 0.15); border: 1px solid var(--warmup); 
        }

        .type-badge { 
            background: #444; color: #aaa; padding: 10px; border-radius: 8px; 
            width: 60px; text-align: center; font-weight: bold; font-size: 0.9rem; cursor: pointer;
        }
        .is-warmup .type-badge { background: var(--warmup); color: black; }

        input { 
            background: #000; border: 1px solid #444; color: white; 
            padding: 12px; border-radius: 8px; width: 100%; text-align: center; font-size: 1.2rem; 
        }
        input:focus { border-color: var(--accent); outline: none; }

        .del-btn { background: none; border: none; color: var(--del); font-size: 1.8rem; padding: 0 10px; cursor: pointer; }
        
        .add-btn { 
            width: 100%; padding: 12px; background: #333; color: var(--accent); 
            border: 1px dashed var(--accent); border-radius: 8px; margin-top: 10px; 
            cursor: pointer; font-weight: bold; font-size: 1rem;
        }

        .save-btn { 
            position: fixed; bottom: 30px; left: 5%; width: 90%; 
            background: var(--accent); color: black; padding: 18px; 
            font-size: 1.5rem; font-weight: 800; border-radius: 60px; border: none; 
            box-shadow: 0 0 20px rgba(0,230,118,0.5); cursor: pointer; z-index: 100;
        }
    </style>
</head>
<body>

    <div id="home-screen" class="screen visible">
        <h1>Gym Tracker V17 🧠</h1>
        <p style="color:#777;">זוכר הכל: מבנה, משקלים וחזרות.</p>
        <button class="menu-btn" onclick="app.load('legs')">🦵 רגליים</button>
        <button class="menu-btn" onclick="app.load('push')">💪 חזה/כתפיים/יד אחורית</button>
        <button class="menu-btn" onclick="app.load('pull')">🦍 גב/יד קדמית</button>
    </div>

    <div id="workout-screen" class="screen">
        <button onclick="location.reload()" style="background:none; border:none; color:#888; margin-bottom:20px; text-decoration:underline;">חזרה לתפריט</button>
        <h2 id="page-title">...</h2>
        <div id="container"></div>
        <button class="save-btn" onclick="app.save()">💾 שמור אימון</button>
    </div>

    <script>
        const firebaseConfig = {
          apiKey: "AIzaSyBR9taEgDlp4CaFa1oDlA2wM9ENoZD2V9U",
          authDomain: "nano-banana-gallery-4e291.firebaseapp.com",
          projectId: "nano-banana-gallery-4e291",
          storageBucket: "nano-banana-gallery-4e291.firebasestorage.app",
          messagingSenderId: "843216131791",
          appId: "1:843216131791:web:e63ec1ab2f70b0808dc9ba"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const COLLECTION = "gym_v17_full_memory"; 

        const EXERCISES = {
            'legs': { title: 'רגליים ובטן', list: [
                {id:'squat', n:'סקוואט'}, {id:'leg_curl', n:'כפיפת ברכיים'}, 
                {id:'leg_ext', n:'פשיטת ברכיים'}, {id:'calves', n:'תאומים'}, {id:'abs', n:'בטן'}
            ]},
            'push': { title: 'חזה וכתפיים', list: [
                {id:'bench', n:'לחיצת חזה'}, {id:'incline', n:'חזה עליון'}, 
                {id:'flys', n:'פרפר'}, {id:'press', n:'לחיצת כתפיים'}, 
                {id:'lat_raise', n:'הרחקת כתפיים'}, {id:'tri', n:'יד אחורית'}
            ]},
            'pull': { title: 'גב ויד קדמית', list: [
                {id:'pullups', n:'מתח'}, {id:'row', n:'חתירה'}, 
                {id:'curl', n:'כפיפת מרפקים'}, {id:'hammer', n:'פטישים'}
            ]}
        };

        const app = {
            currentType: null,

            load: async (type) => {
                app.currentType = type;
                document.getElementById('home-screen').classList.remove('visible');
                document.getElementById('workout-screen').classList.add('visible');
                document.getElementById('page-title').innerText = EXERCISES[type].title;
                const container = document.getElementById('container');
                container.innerHTML = '<div style="margin-top:50px;">טוען את האימון האחרון מהענן...</div>';

                let lastWorkoutData = {};
                try {
                    const snap = await db.collection(COLLECTION).where('type','==',type).orderBy('date','desc').limit(1).get();
                    if(!snap.empty) {
                        lastWorkoutData = snap.docs[0].data().data;
                    }
                } catch(e) {
                    alert("שגיאת רשת: " + e.message);
                }

                container.innerHTML = '';

                EXERCISES[type].list.forEach(ex => {
                    const card = document.createElement('div');
                    card.className = 'exercise-card';
                    card.innerHTML = `<span class="ex-title">${ex.n}</span><div id="rows-${ex.id}"></div>`;
                    
                    const addBtn = document.createElement('button');
                    addBtn.className = 'add-btn';
                    addBtn.innerText = '+ הוסף סט';
                    addBtn.onclick = () => app.addRow(ex.id, false, '', '');
                    card.appendChild(addBtn);
                    
                    container.appendChild(card);

                    // שחזור מלא: מבנה + נתונים
                    if (lastWorkoutData[ex.id] && lastWorkoutData[ex.id].length > 0) {
                        lastWorkoutData[ex.id].forEach(savedRow => {
                            // מעבירים גם את המשקל (w) והחזרות (r) לפונקציה
                            app.addRow(ex.id, savedRow.isWarmup, savedRow.w, savedRow.r); 
                        });
                    } else {
                        // ברירת מחדל אם אין היסטוריה
                        app.addRow(ex.id, false, '', '');
                        app.addRow(ex.id, false, '', '');
                        app.addRow(ex.id, false, '', '');
                    }
                });
            },

            // הפונקציה מקבלת עכשיו גם משקל וחזרות
            addRow: (exId, isWarmup, weight = '', reps = '') => {
                const container = document.getElementById(`rows-${exId}`);
                const row = document.createElement('div');
                row.className = isWarmup ? 'set-row is-warmup' : 'set-row';
                
                const badgeText = isWarmup ? 'חימום' : 'סט';
                
                row.innerHTML = `
                    <div class="type-badge" onclick="app.toggleType(this)">${badgeText}</div>
                    <input type="number" placeholder="קג" class="inp-w" value="${weight}">
                    <input type="number" placeholder="חזרות" class="inp-r" value="${reps}">
                    <button class="del-btn" onclick="this.parentElement.remove()">×</button>
                `;
                container.appendChild(row);
            },

            toggleType: (badge) => {
                const row = badge.parentElement;
                const wasWarmup = row.classList.contains('is-warmup');
                
                if (wasWarmup) {
                    row.classList.remove('is-warmup');
                    badge.innerText = 'סט';
                } else {
                    row.classList.add('is-warmup');
                    badge.innerText = 'חימום';
                }
            },

            save: async () => {
                const btn = document.querySelector('.save-btn');
                btn.innerText = "שומר...";
                
                const allData = {};
                
                EXERCISES[app.currentType].list.forEach(ex => {
                    const rowsDiv = document.getElementById(`rows-${ex.id}`);
                    const rows = rowsDiv.querySelectorAll('.set-row');
                    const exData = [];
                    
                    rows.forEach(row => {
                        const w = row.querySelector('.inp-w').value;
                        const r = row.querySelector('.inp-r').value;
                        const isWarmup = row.classList.contains('is-warmup');
                        
                        // שומרים הכל כולל הערכים
                        exData.push({ w, r, isWarmup });
                    });
                    
                    if(exData.length > 0) allData[ex.id] = exData;
                });

                try {
                    await db.collection(COLLECTION).add({
                        type: app.currentType,
                        date: firebase.firestore.FieldValue.serverTimestamp(),
                        data: allData
                    });
                    btn.innerText = "נשמר! ✅";
                    setTimeout(() => { location.reload(); }, 1500);
                } catch(e) {
                    alert("שגיאה: " + e.message);
                    btn.innerText = "שגיאה";
                }
            }
        };
    </script>
</body>
</html>
