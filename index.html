<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gym Tracker Pro V4 💪</title>
    
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
        :root {
            --bg: #121212; --card: #1e1e1e; --text: #e0e0e0; 
            --accent: #00e676; --warmup: #ff9800; --input-bg: #2c2c2c;
        }
        body { 
            font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text);
            text-align: center; padding: 15px; margin: 0; 
            -webkit-tap-highlight-color: transparent;
        }
        
        h1 { color: var(--accent); margin-bottom: 20px; font-size: 1.8rem; }
        .menu-grid { display: grid; grid-template-columns: 1fr; gap: 15px; max-width: 500px; margin: 0 auto; }
        
        .menu-btn {
            background: var(--card); border: 2px solid var(--accent); color: white;
            padding: 20px; font-size: 1.1rem; font-weight: bold; border-radius: 15px;
            cursor: pointer; display: flex; align-items: center; justify-content: center;
        }
        .menu-btn:active { transform: scale(0.96); background: var(--accent); color: black; }

        .screen { display: none; max-width: 600px; margin: 0 auto; padding-bottom: 50px; }
        .back-btn { background: none; border: none; color: #888; font-size: 0.9rem; margin-bottom: 15px; cursor: pointer; text-decoration: underline; }
        
        .exercise-card {
            background: var(--card); padding: 10px; margin-bottom: 15px; border-radius: 12px;
            text-align: right; border-right: 4px solid var(--accent);
        }
        .ex-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .ex-title { font-size: 1.1rem; font-weight: bold; color: white; }
        
        .add-set-btn {
            background: var(--card); border: 1px solid var(--accent); color: var(--accent);
            border-radius: 50%; width: 30px; height: 30px; font-size: 1.2rem; cursor: pointer;
        }

        .set-row { 
            display: flex; gap: 8px; margin-bottom: 8px; align-items: center; 
            background: rgba(255,255,255,0.03); padding: 5px; border-radius: 5px;
        }
        .set-row.warmup { border: 1px solid var(--warmup); background: rgba(255, 152, 0, 0.1); }
        
        .set-label { font-size: 0.7rem; color: #aaa; width: 30px; }
        .warmup-label { font-size: 0.7rem; color: var(--warmup); font-weight: bold; width: 40px; }

        input[type="number"] {
            background: var(--input-bg); border: 1px solid #444; color: white;
            padding: 8px; border-radius: 5px; text-align: center; font-size: 0.9rem;
            width: 100%; box-sizing: border-box; flex: 1;
        }
        input:focus { border-color: var(--accent); outline: none; }
        ::placeholder { color: #666; font-size: 0.8rem; }
        
        .del-btn { background: none; border: none; color: #ff5252; cursor: pointer; font-size: 1.2rem; }

        .save-btn {
            background: var(--accent); color: black; border: none; width: 100%;
            padding: 15px; font-size: 1.2rem; font-weight: bold; border-radius: 50px;
            margin-top: 20px; cursor: pointer; position: sticky; bottom: 10px; 
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }

        .history-item { 
            background: var(--card); padding: 15px; margin-bottom: 10px; border-radius: 10px; 
            text-align: right; border-left: 3px solid #666; 
        }
        .history-date { font-size: 0.8rem; color: #888; margin-bottom: 5px; }
        .history-type { font-weight: bold; color: var(--accent); margin-bottom: 10px; }
        .history-detail { font-size: 0.85rem; color: #ccc; white-space: pre-wrap; line-height: 1.4; }

        select { padding: 12px; background: var(--card); color: white; border: 1px solid var(--accent); border-radius: 8px; width: 100%; margin-bottom: 20px; }
        canvas { background: var(--card); border-radius: 10px; padding: 5px; }
    </style>
</head>
<body>

    <div id="home-screen" class="screen" style="display:block;">
        <h1>Gym Tracker V4 🏋️‍♂️</h1>
        <div class="menu-grid">
            <button class="menu-btn" onclick="openWorkout('legs')">🦵 רגליים ובטן</button>
            <button class="menu-btn" onclick="openWorkout('pull')">🦍 גב ויד קדמית</button>
            <button class="menu-btn" onclick="openWorkout('push')">💪 חזה, כתפיים ויד אחורית</button>
            <button class="menu-btn" style="border-color:#ff9800; color:#ff9800;" onclick="openHistory()">📜 היסטוריה וגרפים</button>
        </div>
    </div>

    <div id="workout-screen" class="screen">
        <button class="back-btn" onclick="goHome()">חזרה לתפריט</button>
        <h2 id="workout-title">שם האימון</h2>
        <div id="exercises-container"></div>
        <button class="save-btn" onclick="saveWorkout()">💾 שמור אימון</button>
    </div>

    <div id="history-screen" class="screen">
        <button class="back-btn" onclick="goHome()">חזרה לתפריט</button>
        <h3>📈 גרף התקדמות (כוח משוקלל)</h3>
        <select id="graph-select" onchange="renderGraph()"></select>
        <canvas id="progressChart"></canvas>
        <h3 style="margin-top:30px;">📜 היסטוריית אימונים</h3>
        <div id="history-list"></div>
    </div>

    <script>
        const firebaseConfig = {
          apiKey: "AIzaSyBR9taEgDlp4CaFa1oDlA2wM9ENoZD2V9U",
          authDomain: "nano-banana-gallery-4e291.firebaseapp.com",
          projectId: "nano-banana-gallery-4e291",
          storageBucket: "nano-banana-gallery-4e291.firebasestorage.app",
          messagingSenderId: "843216131791",
          appId: "1:843216131791:web:e63ec1ab2f70b0808dc9ba"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const COLLECTION = "gym_tracker_v4"; // גרסה חדשה לנתונים

        // שיניתי את השמות כדי למנוע בעיות עם גרשיים
        // השתמשתי ב-ID באנגלית (מפתח) ובשם תצוגה בעברית בנפרד
        const workoutData = {
            'legs': { 
                title: 'רגליים ובטן', 
                exercises: [
                    {id: 'squat', name: 'סקוואט'},
                    {id: 'leg_curl', name: 'כפיפת ברכיים'},
                    {id: 'leg_ext', name: 'פשיטת ברכיים'},
                    {id: 'calves', name: 'עליות תאומים'},
                    {id: 'abs', name: 'כפיפות בטן'},
                    {id: 'leg_raise', name: 'הרמות רגליים'}
                ]
            },
            'pull': { 
                title: 'גב ויד קדמית', 
                exercises: [
                    {id: 'pullups', name: 'מתח'},
                    {id: 'chinup', name: 'מתח עילי'},
                    {id: 'row_seated', name: 'חתירה בכיסא'},
                    {id: 'rear_delt', name: 'כתף אחורית'},
                    {id: 'bicep_curl', name: 'כפיפה במרפק'},
                    {id: 'hammer_curl', name: 'פטישים באלכסון'}
                ]
            },
            'push': { 
                title: 'חזה, כתפיים ויד אחורית', 
                exercises: [
                    {id: 'bench_press', name: 'באנץ\''}, // הוספתי \ לפני הגרש בקוד
                    {id: 'incline_bench', name: 'באנץ\' בשיפוע'},
                    {id: 'flys', name: 'פרפר'},
                    {id: 'shoulders', name: 'כתפיים'},
                    {id: 'lat_raise', name: 'פשיטת כתפיים'},
                    {id: 'triceps', name: 'יד אחורית'},
                    {id: 'overhead_tri', name: 'יד אחורית מעל הראש'}
                ]
            }
        };

        let currentWorkoutType = '';

        function goHome() {
            document.querySelectorAll('.screen').forEach(s => s.style.display = 'none');
            document.getElementById('home-screen').style.display = 'block';
        }

        async function openWorkout(type) {
            currentWorkoutType = type;
            document.querySelectorAll('.screen').forEach(s => s.style.display = 'none');
            document.getElementById('workout-screen').style.display = 'block';
            document.getElementById('workout-title').innerText = workoutData[type].title;
            
            const container = document.getElementById('exercises-container');
            container.innerHTML = 'טוען נתונים מהאימון הקודם...';

            let lastExercises = {};
            try {
                const snapshot = await db.collection(COLLECTION).where('type', '==', type).orderBy('date', 'desc').limit(1).get();
                if (!snapshot.empty) {
                    lastExercises = snapshot.docs[0].data().exercisesData || {};
                }
            } catch (e) { console.log("No previous data", e); }

            container.innerHTML = '';

            workoutData[type].exercises.forEach(ex => {
                const card = document.createElement('div');
                card.className = 'exercise-card';
                card.id = `card-${ex.id}`;

                // שולחים את ה-ID (באנגלית) לפונקציה, ככה שום גרש לא ישבור את הקוד
                card.innerHTML = `
                    <div class="ex-header">
                        <span class="ex-title">${ex.name}</span>
                        <button class="add-set-btn" onclick="addSetRow('${ex.id}', true)">+</button>
                    </div>
                    <div id="sets-${ex.id}"></div>
                `;
                container.appendChild(card);

                // שחזור סטים: אם אין היסטוריה, 2 שורות ריקות. אם יש - משחזר הכל כולל חימומים
                const prevSets = lastExercises[ex.id] || [{ w: '', r: '', isWarmup: false }, { w: '', r: '', isWarmup: false }];
                
                prevSets.forEach(set => {
                    addSetRow(ex.id, set.isWarmup, set.w, set.r);
                });
            });
        }

        function addSetRow(exId, isWarmup = false, weight = '', reps = '') {
            const container = document.getElementById(`sets-${exId}`);
            const row = document.createElement('div');
            row.className = `set-row ${isWarmup ? 'warmup' : ''}`;
            
            row.innerHTML = `
                ${isWarmup ? '<span class="warmup-label">🔥 חימום</span>' : '<span class="set-label">עבודה</span>'}
                <input type="number" placeholder="משקל" class="inp-weight" value="${weight}">
                <input type="number" placeholder="חזרות" class="inp-reps" value="${reps}">
                <button class="del-btn" onclick="this.parentElement.remove()">×</button>
            `;

            if (isWarmup) {
                container.prepend(row); 
            } else {
                container.appendChild(row);
            }
        }

        function saveWorkout() {
            const exercisesData = {};
            const exerciseList = workoutData[currentWorkoutType].exercises;
            
            exerciseList.forEach(ex => {
                const setsDiv = document.getElementById(`sets-${ex.id}`);
                const rows = setsDiv.querySelectorAll('.set-row');
                const setsData = [];
                
                rows.forEach(row => {
                    const w = row.querySelector('.inp-weight').value;
                    const r = row.querySelector('.inp-reps').value;
                    const isWarmup = row.classList.contains('warmup');
                    
                    // שומרים גם אם ריק, כדי לשמור על מבנה הסטים לפעם הבאה!
                    setsData.push({ w: w, r: r, isWarmup: isWarmup });
                });
                
                if (setsData.length > 0) exercisesData[ex.id] = setsData;
            });

            db.collection(COLLECTION).add({
                type: currentWorkoutType,
                date: firebase.firestore.FieldValue.serverTimestamp(),
                exercisesData: exercisesData
            }).then(() => {
                confetti({ particleCount: 150, spread: 70, origin: { y: 0.6 } });
                alert("אימון נשמר! התחזקת 💪");
                goHome();
            }).catch(e => alert("שגיאה: " + e));
        }

        async function openHistory() {
            document.querySelectorAll('.screen').forEach(s => s.style.display = 'none');
            document.getElementById('history-screen').style.display = 'block';
            
            const select = document.getElementById('graph-select');
            select.innerHTML = '<option value="">בחר תרגיל להצגה...</option>';
            
            const allExercises = [];
            Object.values(workoutData).forEach(cat => {
                cat.exercises.forEach(ex => allExercises.push(ex));
            });
            
            allExercises.sort((a,b) => a.name.localeCompare(b.name)).forEach(ex => {
                select.innerHTML += `<option value="${ex.id}">${ex.name}</option>`;
            });

            const list = document.getElementById('history-list');
            list.innerHTML = 'טוען...';
            
            const snapshot = await db.collection(COLLECTION).orderBy('date', 'desc').limit(20).get();
            list.innerHTML = '';
            
            if(snapshot.empty) { list.innerHTML = "אין אימונים עדיין."; return; }

            snapshot.forEach(doc => {
                const d = doc.data();
                const dateObj = d.date ? d.date.toDate() : new Date();
                const dateStr = dateObj.toLocaleDateString('he-IL') + ' ' + dateObj.toLocaleTimeString('he-IL', {hour:'2-digit', minute:'2-digit'});
                
                let details = "";
                // מציאת השם בעברית לפי ה-ID
                const findName = (id) => {
                    for(let cat in workoutData) {
                        const found = workoutData[cat].exercises.find(e => e.id === id);
                        if(found) return found.name;
                    }
                    return id;
                };

                for (const [exId, sets] of Object.entries(d.exercisesData)) {
                    const workSets = sets.filter(s => !s.isWarmup && s.w > 0).map(s => `${s.w}x${s.r}`).join(', ');
                    if(workSets) details += `${findName(exId)}: ${workSets}\n`;
                }

                list.innerHTML += `
                    <div class="history-item">
                        <div class="history-date">${dateStr}</div>
                        <div class="history-type">${workoutData[d.type]?.title || d.type}</div>
                        <div class="history-detail">${details || 'רק חימום / ללא נתונים'}</div>
                    </div>
                `;
            });
        }

        let myChart = null;
        async function renderGraph() {
            const exId = document.getElementById('graph-select').value;
            if (!exId) return;

            // מציאת השם בעברית לכותרת
            let exName = exId;
            for(let cat in workoutData) {
                const found = workoutData[cat].exercises.find(e => e.id === exId);
                if(found) exName = found.name;
            }

            const snapshot = await db.collection(COLLECTION).orderBy('date', 'asc').get();
            const labels = [];
            const dataPoints = [];

            snapshot.forEach(doc => {
                const d = doc.data();
                if (d.exercisesData && d.exercisesData[exId]) {
                    const sets = d.exercisesData[exId];
                    let maxStrength = 0;
                    sets.forEach(s => {
                        const w = Number(s.w);
                        const r = Number(s.r);
                        if (!s.isWarmup && w > 0 && r > 0) {
                            const strength = w * (1 + r / 30);
                            if (strength > maxStrength) maxStrength = strength;
                        }
                    });

                    if (maxStrength > 0) {
                        const dateObj = d.date.toDate();
                        labels.push(dateObj.toLocaleDateString('he-IL', {day:'2-digit', month:'2-digit'}));
                        dataPoints.push(Math.round(maxStrength));
                    }
                }
            });

            const ctx = document.getElementById('progressChart').getContext('2d');
            if (myChart) myChart.destroy();

            myChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [{
                        label: `כוח משוקלל: ${exName}`,
                        data: dataPoints,
                        borderColor: '#00e676',
                        backgroundColor: 'rgba(0, 230, 118, 0.1)',
                        borderWidth: 3,
                        pointBackgroundColor: '#fff',
                        pointRadius: 5,
                        fill: true,
                        tension: 0.3
                    }]
                },
                options: {
                    responsive: true,
                    scales: {
                        y: { beginAtZero: false, grid: { color: '#333' }, ticks: { color: '#ccc' } },
                        x: { grid: { color: '#333' }, ticks: { color: '#ccc' } }
                    },
                    plugins: { legend: { labels: { color: 'white' } } }
                }
            });
        }
    </script>
</body>
</html>
